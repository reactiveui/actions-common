name: Common A/B benchmarks workflow

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      base:
        type: string
        required: true
        description: 'Baseline commit.'

      head:
        type: string
        required: true
        description: 'Commit compared against the baseline.'

      projects:
        type: string
        required: true
        description: 'Newline-separated benchmark projects (.csproj), relative to src.'

      solutionFile:
        type: string
        default: ''
        description: 'Solution the workload restore reads, relative to src.'

      installWorkloads:
        type: boolean
        default: false
        description: 'Run workload restore.'

      dotnetVersions:
        type: string
        default: |
          8.0.x
          9.0.x
          10.0.x
          11.0.x
        description: 'Newline-separated list of .NET SDKs to install. It must cover every runtime the benchmark classes declare a job for.'

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      BENCHMARK_PROFILERS: false

    steps:
      - name: Benchmark base
        uses: reactiveui/actions-common/.github/actions/dotnet-benchmarks@main
        with:
          revision: ${{ inputs.base }}
          projects: ${{ inputs.projects }}
          results-folder: ${{ runner.temp }}/benchmark-ab/base
          solution-file: ${{ inputs.solutionFile }}
          install-workloads: ${{ inputs.installWorkloads }}
          dotnet-versions: ${{ inputs.dotnetVersions }}

      - name: Benchmark head
        uses: reactiveui/actions-common/.github/actions/dotnet-benchmarks@main
        with:
          revision: ${{ inputs.head }}
          projects: ${{ inputs.projects }}
          results-folder: ${{ runner.temp }}/benchmark-ab/head
          solution-file: ${{ inputs.solutionFile }}
          install-workloads: ${{ inputs.installWorkloads }}
          dotnet-versions: ${{ inputs.dotnetVersions }}

      - name: Compare base and head
        uses: reactiveui/actions-common/.github/actions/benchmark-compare@main
        with:
          base-folder: ${{ runner.temp }}/benchmark-ab/base
          head-folder: ${{ runner.temp }}/benchmark-ab/head

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-ab
          path: ${{ runner.temp }}/benchmark-ab
