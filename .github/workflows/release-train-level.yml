name: Release train level

# release-train.yml calls this once per level. Each repository in the level runs as one matrix job.
on:
  workflow_call:
    inputs:
      level:
        type: number
        required: true
        description: 'Level number. Level 0 has no earlier results to read.'

      repositories:
        type: string
        required: true
        description: 'JSON list of the repositories in this level, from the plan job.'

      settings:
        type: string
        required: true
        description: 'JSON settings from the plan job.'

    secrets:
      RELEASE_TRAIN_APP_CLIENT_ID:
        required: true
        description: 'Client ID of the GitHub App that opens pull requests, merges them and starts release workflows.'

      RELEASE_TRAIN_APP_PRIVATE_KEY:
        required: true
        description: 'Private key (.pem contents) of that GitHub App.'

permissions:
  contents: read

jobs:
  release:
    name: ${{ matrix.repository.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # A cancelled release can leave packages half published, so a failure never cancels the other repositories in the level.
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(inputs.repositories) }}
    env:
      ENTRY: ${{ toJSON(matrix.repository) }}
    steps:
      - name: Setup .NET Environment
        uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
        with:
          stamp-version: 'false'

      - name: Download earlier results
        if: inputs.level > 0
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: train-result-*
          merge-multiple: true
          path: ${{ runner.temp }}/train-results

      - name: Update dependencies
        id: update
        uses: reactiveui/actions-common/.github/actions/release-train-update@main
        env:
          APP_CLIENT_ID: ${{ secrets.RELEASE_TRAIN_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
        with:
          entry: ${{ env.ENTRY }}
          settings: ${{ inputs.settings }}
          results-folder: ${{ runner.temp }}/train-results
          work-folder: ${{ runner.temp }}/train

      - name: Release
        id: release
        if: steps.update.outputs.blocked != 'true'
        uses: reactiveui/actions-common/.github/actions/release-train-release@main
        env:
          APP_CLIENT_ID: ${{ secrets.RELEASE_TRAIN_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
        with:
          entry: ${{ env.ENTRY }}
          timeout-minutes: ${{ fromJSON(inputs.settings).releaseMinutes }}
          work-folder: ${{ runner.temp }}/train

      - name: Wait for NuGet
        id: nuget
        if: steps.update.outputs.blocked != 'true'
        uses: reactiveui/actions-common/.github/actions/release-train-nuget-wait@main
        with:
          release-file: ${{ runner.temp }}/train/release.json
          timeout-minutes: ${{ fromJSON(inputs.settings).nugetMinutes }}

      - name: Record result
        if: always()
        uses: reactiveui/actions-common/.github/actions/release-train-record@main
        with:
          name: ${{ matrix.repository.name }}
          repository: ${{ matrix.repository.repository }}
          blocked: ${{ steps.update.outputs.blocked }}
          reason: ${{ steps.update.outputs.reason }}
          update-outcome: ${{ steps.update.outcome }}
          release-outcome: ${{ steps.release.outcome }}
          nuget-outcome: ${{ steps.nuget.outcome }}
          pull-request: ${{ steps.update.outputs.pull-request }}
          run-url: ${{ steps.release.outputs.run-url }}
          reused: ${{ steps.release.outputs.reused }}
          work-folder: ${{ runner.temp }}/train
          result-folder: ${{ runner.temp }}/train-result

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: train-result-${{ matrix.repository.name }}
          path: ${{ runner.temp }}/train-result/*.json
          if-no-files-found: error
