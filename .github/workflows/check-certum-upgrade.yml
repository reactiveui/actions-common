name: Check Certum upgrade

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  sign-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/reactiveui/certum-signer:20261004-ade758c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
    steps:
      - name: Check signing credentials
        shell: bash
        run: |
          cd "$RUNNER_TEMP" && dotnet run - <<'CS'
          using static System.Environment;

          foreach (var name in new[] { "CERTUM_USER_ID", "CERTUM_OTP_URI" })
          {
              if (string.IsNullOrWhiteSpace(GetEnvironmentVariable(name)))
              {
                  Console.WriteLine($"::error::Missing signing secret: {name}");
                  return 1;
              }
          }

          return 0;
          CS

      - name: Pack sample NuGet package
        shell: bash
        run: |
          cd "$RUNNER_TEMP" && dotnet run - <<'CS'
          using System.Diagnostics;
          using static System.Environment;

          var source = Path.Combine(GetEnvironmentVariable("RUNNER_TEMP")!, "certum-sample");
          var output = Path.Combine(GetEnvironmentVariable("GITHUB_WORKSPACE")!, "signed");
          if (Process.Run("dotnet", ["new", "classlib", "--name", "Certum.Signing.Smoke", "--framework", "net10.0", "--output", source, "--no-restore"]) is { ExitCode: not 0 } create)
          {
              return create.ExitCode;
          }

          return Process.Run("dotnet", ["pack", Path.Combine(source, "Certum.Signing.Smoke.csproj"), "--configuration", "Release", "-p:PackageVersion=0.0.0", "--output", output]).ExitCode;
          CS

      - name: Login and sign sample
        uses: reactiveui/actions-common/.github/actions/certum-sign@main
        with:
          packages-glob: signed/*.nupkg

      - name: Upload verified sample
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: certum-signed-sample
          path: signed/*.nupkg
          retention-days: 1
          if-no-files-found: error
