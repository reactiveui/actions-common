name: Common GitHub release creation workflow

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
        description: 'Version string used for the release title and release notes heading'

      tag:
        type: string
        default: ''
        description: 'Git tag to attach the release to (e.g. v2.4.0). Defaults to version when empty (back-compat).'

      artifactName:
        type: string
        default: 'signed-nuget'
        description: 'Name of the artifact containing .nupkg files to attach to the release'

      target:
        type: string
        default: ''
        description: 'Commit SHA (or branch) the new tag is created from. Empty = the commit that triggered the run (github.sha). Set to the built source SHA when re-releasing historical source so the tag points at that commit.'

      prerelease:
        type: boolean
        default: false
        description: 'Mark the GitHub release as a pre-release (adds --prerelease). Pass workflow-common-release''s prerelease output so beta/rc cuts are flagged as pre-releases and not surfaced as "Latest".'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.artifactName }}
          path: ./signed

      - name: Setup .NET Environment
        uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
        with:
          stamp-version: 'false'

      - name: Install GitReleaseNoteGenerator
        run: dotnet tool install -g GitReleaseNoteGenerator

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git-release-notes --release-version "${{ inputs.version }}" --output-file release-notes.md

      # Also creates the tag, pinned by --target to the commit the release job built.
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag != '' && inputs.tag || inputs.version }}
          TARGET: ${{ inputs.target != '' && inputs.target || github.sha }}
          TITLE: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          cd "$RUNNER_TEMP" && dotnet run - -- "$REPO" "$TAG" "$TARGET" "$TITLE" "$PRERELEASE" <<'CS'
          using System.Diagnostics;
          using static System.Environment;

          if (args is not [var repository, var tag, var target, var title, var prerelease])
          {
              Console.WriteLine("::error::Expected the repository, tag, target, title and pre-release arguments.");
              return 2;
          }

          Directory.SetCurrentDirectory(GetEnvironmentVariable("GITHUB_WORKSPACE")!);

          string[] flags = prerelease is "true" ? ["--prerelease"] : [];
          return Process.Run(
              "gh",
              ["release", "create", tag, "--repo", repository, "--target", target, "--title", title, "--notes-file", "release-notes.md", .. flags, .. Directory.GetFiles("signed", "*.nupkg")]).ExitCode;
          CS
