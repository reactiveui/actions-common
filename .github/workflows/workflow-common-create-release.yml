name: Common GitHub release creation workflow

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
        description: 'Version string used for the release title and release notes heading'

      tag:
        type: string
        default: ''
        description: 'Git tag to attach the release to (e.g. v2.4.0). Defaults to version when empty (back-compat).'

      artifactName:
        type: string
        default: 'signed-nuget'
        description: 'Name of the artifact containing .nupkg files to attach to the release'

      target:
        type: string
        default: ''
        description: 'Commit SHA (or branch) the new tag is created from. Empty = the commit that triggered the run (github.sha). Set to the built source SHA when re-releasing historical source so the tag points at that commit.'

      prerelease:
        type: boolean
        default: false
        description: 'Mark the GitHub release as a pre-release (adds --prerelease). Pass workflow-common-release''s prerelease output so beta/rc cuts are flagged as pre-releases and not surfaced as "Latest".'

jobs:
  # ============================
  # CREATE GITHUB RELEASE (Linux)
  # ============================
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifactName }}
          path: ./signed

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Install GitReleaseNoteGenerator
        run: dotnet tool install -g GitReleaseNoteGenerator

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git-release-notes --release-version "${{ inputs.version }}" --output-file release-notes.md

      # Creates the tag too: workflow-common-release.yml no longer pushes it up
      # front (so a failed build/sign/publish leaves no orphan tag). --target pins
      # the new tag to the exact commit this run built.
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag != '' && inputs.tag || inputs.version }}
          TARGET: ${{ inputs.target != '' && inputs.target || github.sha }}
          TITLE: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          # Flag beta/rc cuts as pre-releases so GitHub keeps the latest stable
          # tagged "Latest" rather than promoting a pre-release over it.
          PRERELEASE_FLAG=()
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$TARGET" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            "${PRERELEASE_FLAG[@]}" \
            ./signed/*.nupkg
