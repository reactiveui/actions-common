name: Common GitHub release creation workflow

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
        description: 'Version string used for the release title and release notes heading'

      tag:
        type: string
        default: ''
        description: 'Git tag to attach the release to (e.g. v2.4.0). Defaults to version when empty (back-compat).'

      artifactName:
        type: string
        default: 'signed-nuget'
        description: 'Name of the artifact containing the files to attach to the release'

      assetGlob:
        type: string
        default: '*.nupkg'
        description: 'File name pattern, within the artifact, of the files to attach to the release'

      target:
        type: string
        default: ''
        description: 'Commit SHA (or branch) the new tag is created from. Empty = the commit that triggered the run (github.sha). Set to the built source SHA when re-releasing historical source so the tag points at that commit.'

      prerelease:
        type: boolean
        default: false
        description: 'Mark the GitHub release as a pre-release (adds --prerelease). Pass workflow-common-release''s prerelease output so beta/rc cuts are flagged as pre-releases and not surfaced as "Latest".'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifactName }}
          path: ./signed

      - name: Setup .NET Environment
        uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
        with:
          stamp-version: 'false'

      - name: Install GitReleaseNoteGenerator
        run: dotnet tool install -g GitReleaseNoteGenerator

      - name: Generate release notes
        env:
          DOTNET_ROLL_FORWARD: Major
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: git-release-notes --release-version "$RELEASE_VERSION" --output-file release-notes.md

      # Also creates the tag, pinned by --target to the commit the release job built.
      - name: Create GitHub Release
        uses: reactiveui/actions-common/.github/actions/github-release-create@main
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          tag: ${{ inputs.tag != '' && inputs.tag || inputs.version }}
          target: ${{ inputs.target != '' && inputs.target || github.sha }}
          title: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          asset-glob: ${{ inputs.assetGlob }}
