name: Common SonarCloud fork-PR analysis workflow

# Fork PRs get no secrets, so the caller triggers this on `workflow_run` after the PR build,
# where the base repository's SONAR_TOKEN is available.
#
# SECURITY: this builds untrusted fork code on a runner holding SONAR_TOKEN. The scanner has to
# wrap the real build, so that exposure is accepted for a token scoped to one project's analysis.
# Never give this job a higher-privilege secret.

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: common-sonarcloud-fork-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') }}

on:
  workflow_call:
    inputs:
      configuration:
        type: string
        default: 'Release'
        description: 'Build configuration'

      dotnetVersions:
        type: string
        default: |
          8.0.x
          9.0.x
          10.0.x
          11.0.x
        description: 'Newline-separated list of .NET SDKs'

      solutionFile:
        type: string
        description: 'Solution file relative to srcFolder'

      srcFolder:
        type: string
        default: 'src'
        description: 'Folder containing the solution'

      performTests:
        type: boolean
        default: true
        description: 'Run tests + collect coverage inside the Sonar scan'

      minverMinimumMajorMinor:
        type: string
        default: ''
        description: 'floor major.minor when no tag is reachable (e.g. "1.0").'

      minverTagPrefix:
        type: string
        default: 'v'
        description: 'git tag prefix MinVer expects.'

      minverAutoIncrement:
        type: string
        default: 'minor'
        description: 'auto-increment segment (major|minor|patch).'

      minverDefaultPreReleaseIdentifiers:
        type: string
        default: 'alpha.0'
        description: 'pre-release identifier(s) for height-only builds.'

      sonarProjectKey:
        type: string
        required: true
        description: 'SonarCloud project key (e.g. reactiveui_Foo).'

      sonarOrganization:
        type: string
        required: true
        description: 'SonarCloud organization slug (e.g. reactiveui).'

      sonarHostUrl:
        type: string
        default: 'https://sonarcloud.io'
        description: 'SonarCloud / SonarQube host URL.'

      sonarExtraBeginArgs:
        type: string
        default: ''
        description: 'Extra raw arguments appended to the dotnet-sonarscanner begin invocation (trusted; set by the calling repo, never derived from PR input).'

      sonarExclusions:
        type: string
        default: ''
        description: 'Comma-separated globs for sonar.exclusions. Empty = flag omitted.'

      sonarCoverageExclusions:
        type: string
        default: '**/*Tests/**,**/*Tests.cs,**/Generated/**'
        description: 'Comma-separated globs for sonar.coverage.exclusions. Empty = flag omitted.'

      sonarCpdExclusions:
        type: string
        default: ''
        description: 'Comma-separated globs for sonar.cpd.exclusions. Empty = flag omitted.'

      sonarTestExclusions:
        type: string
        default: ''
        description: 'Comma-separated globs for sonar.test.exclusions. Empty = flag omitted.'

      installWorkloads:
        type: boolean
        default: false
        description: 'If true, run workload restore'

      enableDetailedTestLogging:
        type: boolean
        default: true
        description: 'Enable MTP diagnostic logging.'

      testTimeout:
        type: string
        default: ''
        description: 'Optional global MTP test timeout (format [h|m|s], e.g. "5m"). Empty = no timeout.'

      runsOn:
        type: string
        default: 'windows-latest'
        description: 'Runner the scan executes on. Defaults to windows-latest to match the standard SonarCloud workflow.'

    secrets:
      SONAR_TOKEN:
        required: true
        description: 'SonarCloud token.'

jobs:
  sonarcloud-fork:
    # Same-repo PRs are scanned by workflow-common-sonarcloud.yml.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ${{ inputs.runsOn }}
    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
      # Composite actions cannot declare secret inputs, so the sonarcloud action reads this from env.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Setup .NET SDK
        uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
        with:
          dotnet-versions: ${{ inputs.dotnetVersions }}
          stamp-version: 'false'

      # The pull request comes from the base repository's API, keyed by the commit the build ran on, so the fork
      # cannot point the scan at a different pull request.
      - name: Resolve pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cd "$RUNNER_TEMP" && dotnet run - -- "$REPOSITORY" "$HEAD_SHA" <<'CS'
          using System.Net.Http.Headers;
          using System.Text.Json;
          using static System.Environment;

          if (args is not [var repository, var headSha])
          {
              Console.WriteLine("::error::Expected the repository and head commit arguments.");
              return 2;
          }

          using var http = new HttpClient();
          http.DefaultRequestHeaders.UserAgent.ParseAdd("reactiveui-actions-common");
          http.DefaultRequestHeaders.Accept.ParseAdd("application/vnd.github+json");
          http.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue("Bearer", GetEnvironmentVariable("GH_TOKEN"));

          var api = GetEnvironmentVariable("GITHUB_API_URL") ?? "https://api.github.com";
          using var pulls = JsonDocument.Parse(await http.GetStringAsync($"{api}/repos/{repository}/commits/{headSha}/pulls"));

          foreach (var pull in pulls.RootElement.EnumerateArray())
          {
              var head = pull.GetProperty("head");
              if (head.GetProperty("sha").GetString() == headSha && head.GetProperty("repo") is { ValueKind: JsonValueKind.Object } fork && fork.GetProperty("full_name").GetString() != repository)
              {
                  File.AppendAllLines(GetEnvironmentVariable("GITHUB_OUTPUT")!, [$"number={pull.GetProperty("number").GetInt32()}", $"base={pull.GetProperty("base").GetProperty("ref").GetString()}"]);
                  return 0;
              }
          }

          Console.WriteLine($"::error::No pull request from a fork has head commit {headSha}.");
          return 1;
          CS

      - name: Resolve PR analysis arguments
        id: prargs
        shell: bash
        env:
          # Fork-controlled: read through env, never interpolated into the script.
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_BRANCH: ${{ steps.pr.outputs.base }}
        run: |
          cd "$RUNNER_TEMP" && dotnet run - -- "$HEAD_BRANCH" "$PR_NUMBER" "$BASE_BRANCH" <<'CS'
          using System.Text.RegularExpressions;
          using static System.Environment;

          if (args is not [var headBranch, var number, var baseBranch])
          {
              Console.WriteLine("::error::Expected the head branch, PR number and base branch arguments.");
              return 2;
          }

          File.AppendAllLines(
              GetEnvironmentVariable("GITHUB_OUTPUT")!,
              [$"args=/d:sonar.pullrequest.key={number} /d:sonar.pullrequest.branch={Sanitize(headBranch)} /d:sonar.pullrequest.base={Sanitize(baseBranch)}"]);

          return 0;

          // The sonarcloud action splits extra begin args on spaces, so fork-controlled names are cut down to a safe ref charset.
          static string Sanitize(string name) => Regex.Replace(name, "[^A-Za-z0-9._/-]", string.Empty);
          CS

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The base repo's pull ref builds the fork's head commit with the upstream tags reachable,
          # so MinVer computes the same version as a normal build.
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET Environment
        id: environment
        uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
        with:
          dotnet-versions: ${{ inputs.dotnetVersions }}
          src-folder: ${{ inputs.srcFolder }}
          solution-file: ${{ inputs.solutionFile }}
          install-workloads: ${{ inputs.installWorkloads }}
          minver-tag-prefix: ${{ inputs.minverTagPrefix }}
          minver-minimum-major-minor: ${{ inputs.minverMinimumMajorMinor }}
          minver-auto-increment: ${{ inputs.minverAutoIncrement }}
          minver-default-pre-release-identifiers: ${{ inputs.minverDefaultPreReleaseIdentifiers }}

      - name: SonarCloud begin
        uses: reactiveui/actions-common/.github/actions/sonarcloud@main
        with:
          mode: begin
          project-key: ${{ inputs.sonarProjectKey }}
          organization: ${{ inputs.sonarOrganization }}
          host-url: ${{ inputs.sonarHostUrl }}
          version: ${{ steps.environment.outputs.version-semver2 }}
          extra-begin-args: ${{ steps.prargs.outputs.args }} ${{ inputs.sonarExtraBeginArgs }}
          exclusions: ${{ inputs.sonarExclusions }}
          coverage-exclusions: ${{ inputs.sonarCoverageExclusions }}
          cpd-exclusions: ${{ inputs.sonarCpdExclusions }}
          test-exclusions: ${{ inputs.sonarTestExclusions }}
          working-directory: ${{ inputs.srcFolder }}

      - name: Build
        uses: reactiveui/actions-common/.github/actions/dotnet-build@main
        with:
          configuration: ${{ inputs.configuration }}
          src-folder: ${{ inputs.srcFolder }}
          solution-file: ${{ inputs.solutionFile }}
          create-packages: 'false'

      - name: Test
        if: inputs.performTests == true
        uses: reactiveui/actions-common/.github/actions/dotnet-test@main
        with:
          configuration: ${{ inputs.configuration }}
          src-folder: ${{ inputs.srcFolder }}
          solution-file: ${{ inputs.solutionFile }}
          enable-detailed-test-logging: ${{ inputs.enableDetailedTestLogging }}
          test-timeout: ${{ inputs.testTimeout }}

      - name: SonarCloud end
        # A failed build or test still uploads partial analysis.
        if: always()
        uses: reactiveui/actions-common/.github/actions/sonarcloud@main
        with:
          mode: end
          project-key: ${{ inputs.sonarProjectKey }}
          working-directory: ${{ inputs.srcFolder }}
