name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  packages: read
  actions: read

jobs:
  codeql:
    uses: ./.github/workflows/workflow-common-codeql.yml
    with:
      analyzeCSharp: false
      analyzeActions: true
