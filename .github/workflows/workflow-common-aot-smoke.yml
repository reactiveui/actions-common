name: Common Native AOT smoke workflow

permissions:
  contents: read

concurrency:
  group: common-aot-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_call:
    inputs:
      projectFile:
        type: string
        required: true
        description: 'Native AOT smoke-test project (.csproj) to publish, relative to the repo root. It should set PublishAot=true and exit non-zero when the smoke test fails.'

      executableName:
        type: string
        default: ''
        description: 'Base name of the produced native executable (no extension). Empty = derive from the project file name.'

      configuration:
        type: string
        default: 'Release'
        description: 'Build configuration to publish.'

      dotnetVersions:
        type: string
        default: |
          8.0.x
          9.0.x
          10.0.x
          11.0.x
        description: 'Newline-separated list of .NET SDKs to install (must cover every target framework the project and its references build for).'

      srcFolder:
        type: string
        default: 'src'
        description: 'Folder containing the solution (used only when installWorkloads is true).'

      installWorkloads:
        type: boolean
        default: false
        description: 'If true, run workload restore during environment setup.'

jobs:
  changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: Detect changed areas
        id: changes
        uses: reactiveui/actions-common/.github/actions/detect-changes@main

  aot-smoke:
    name: aot-smoke (${{ matrix.rid }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET Environment
        uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
        with:
          dotnet-versions: ${{ inputs.dotnetVersions }}
          src-folder: ${{ inputs.srcFolder }}
          install-workloads: ${{ inputs.installWorkloads }}

      - name: Install native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # ILC links with clang and zlib; the image usually has both.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish native AOT (${{ matrix.rid }})
        shell: bash
        env:
          PROJECT_FILE: ${{ inputs.projectFile }}
          CONFIGURATION: ${{ inputs.configuration }}
        # Each leg's rid is its runner's own, which an AOT or trimmed publish uses when none is given. Passing
        # --runtime would make it a global property, and every referenced project would restore for it, including
        # multi-targeted heads such as net10.0-ios that have no assets for a desktop runtime.
        run: |
          dotnet publish "$PROJECT_FILE" \
            --configuration "$CONFIGURATION" \
            --output "aot-publish"

      - name: Run native AOT smoke test
        shell: bash
        env:
          PROJECT_FILE: ${{ inputs.projectFile }}
          EXECUTABLE_NAME: ${{ inputs.executableName }}
        run: |
          cd "$RUNNER_TEMP" && dotnet run - -- "$PROJECT_FILE" "$EXECUTABLE_NAME" <<'CS'
          using System.Diagnostics;
          using static System.Environment;

          if (args is not [var projectFile, var executableName])
          {
              Console.WriteLine("::error::Expected the project file and executable name arguments.");
              return 2;
          }

          var workspace = GetEnvironmentVariable("GITHUB_WORKSPACE")!;
          var name = executableName is "" ? Path.GetFileNameWithoutExtension(projectFile) : executableName;
          var binary = Path.Combine(workspace, "aot-publish", OperatingSystem.IsWindows() ? $"{name}.exe" : name);

          Directory.SetCurrentDirectory(workspace);
          Console.WriteLine($"Running native AOT smoke binary: {binary}");
          return Process.Run(binary).ExitCode;
          CS
