name: Common .NET build and release workflow (unsigned)

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      configuration:
        type: string
        default: 'Release'
        description: 'Build configuration'

      dotnetVersions:
        type: string
        default: |
          8.0.x
          9.0.x
          10.0.x
          11.0.x
        description: 'Newline-separated list of .NET SDKs'

      solutionFile:
        type: string
        description: 'Solution file relative to srcFolder'

      srcFolder:
        type: string
        default: 'src'
        description: 'Folder containing the solution'

      installWorkloads:
        type: boolean
        default: false
        description: 'Run dotnet workload restore'

      useUNO:
        type: boolean
        default: false
        description: 'Enable UNO-specific msbuild/pack flow (Windows only)'

    outputs:
      semver2:
        description: 'The NBGV SemVer2 version string'
        value: ${{ jobs.build-release.outputs.semver2 }}

jobs:
  build-release:
    runs-on: windows-latest
    outputs:
      semver2: ${{ steps.environment.outputs.nbgv-semver2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET Environment
        id: environment
        uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
        with:
          dotnet-versions: ${{ inputs.dotnetVersions }}
          src-folder: ${{ inputs.srcFolder }}
          solution-file: ${{ inputs.solutionFile }}
          install-workloads: ${{ inputs.installWorkloads }}

      - name: Build (dotnet)
        if: inputs.useUNO == false
        uses: reactiveui/actions-common/.github/actions/dotnet-build@main
        with:
          configuration: ${{ inputs.configuration }}
          src-folder: ${{ inputs.srcFolder }}
          solution-file: ${{ inputs.solutionFile }}
          create-packages: 'false'

      - name: Build (UNO)
        if: inputs.useUNO == true
        uses: reactiveui/actions-common/.github/actions/dotnet-build-uno@main
        with:
          configuration: ${{ inputs.configuration }}
          src-folder: ${{ inputs.srcFolder }}
          solution-file: ${{ inputs.solutionFile }}

      # SOLUTION_FILE stays unquoted so an empty value passes no argument.
      - name: Pack NuGet packages
        shell: bash
        working-directory: ${{ inputs.srcFolder }}
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          SOLUTION_FILE: ${{ inputs.solutionFile }}
        run: dotnet pack --no-restore --configuration "$CONFIGURATION" $SOLUTION_FILE -o "${GITHUB_WORKSPACE}/packages"

      - name: Upload Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: packages/*.nupkg
          if-no-files-found: error
