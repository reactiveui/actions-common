name: Release train

run-name: Release train (${{ inputs.targets }})

# Releases ReactiveUI repositories in dependency order. build/release-train.json lists the repositories.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Repositories or groups from build/release-train.json, separated by commas. all selects every repository.'
        required: true
        type: string

      includeDownstream:
        description: 'Also release every repository that depends on the targets.'
        type: boolean
        default: true

      exclude:
        description: 'Repositories or groups to leave out, separated by commas.'
        type: string
        default: ''

      bump:
        description: 'Release level for every repository.'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      channel:
        description: 'Release channel. none releases a stable version. alpha, beta and rc release a pre-release.'
        required: true
        default: none
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc

      onFailure:
        description: 'stop starts no new level after a failure. continue keeps releasing repositories that do not depend on the failed one.'
        required: true
        default: stop
        type: choice
        options:
          - stop
          - continue

      dryRun:
        description: 'Show the plan without releasing anything.'
        type: boolean
        default: false

  workflow_call:
    inputs:
      targets:
        description: 'Repositories or groups from build/release-train.json, separated by commas. all selects every repository.'
        required: true
        type: string

      includeDownstream:
        description: 'Also release every repository that depends on the targets.'
        type: boolean
        default: true

      exclude:
        description: 'Repositories or groups to leave out, separated by commas.'
        type: string
        default: ''

      bump:
        description: 'Release level for every repository (patch, minor or major).'
        required: true
        type: string

      channel:
        description: 'Release channel (none, alpha, beta or rc).'
        type: string
        default: none

      onFailure:
        description: 'stop or continue after a failure.'
        type: string
        default: stop

      dryRun:
        description: 'Show the plan without releasing anything.'
        type: boolean
        default: false

    secrets:
      RELEASE_TRAIN_APP_CLIENT_ID:
        required: true
        description: 'Client ID of the GitHub App that opens pull requests, merges them and starts release workflows.'

      RELEASE_TRAIN_APP_PRIVATE_KEY:
        required: true
        description: 'Private key (.pem contents) of that GitHub App.'

    outputs:
      results:
        description: 'JSON list with the result of every planned repository.'
        value: ${{ jobs.summary.outputs.results }}

permissions:
  contents: read

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      depth: ${{ steps.plan.outputs.depth }}
      settings: ${{ steps.plan.outputs.settings }}
      plan: ${{ steps.plan.outputs.plan }}
      level0: ${{ steps.plan.outputs.level0 }}
      level1: ${{ steps.plan.outputs.level1 }}
      level2: ${{ steps.plan.outputs.level2 }}
      level3: ${{ steps.plan.outputs.level3 }}
      level4: ${{ steps.plan.outputs.level4 }}
      level5: ${{ steps.plan.outputs.level5 }}
      level6: ${{ steps.plan.outputs.level6 }}
      level7: ${{ steps.plan.outputs.level7 }}
      level8: ${{ steps.plan.outputs.level8 }}
      level9: ${{ steps.plan.outputs.level9 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET Environment
        uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
        with:
          stamp-version: 'false'

      - name: Plan release order
        id: plan
        uses: reactiveui/actions-common/.github/actions/release-train-plan@main
        env:
          APP_CLIENT_ID: ${{ secrets.RELEASE_TRAIN_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
        with:
          config: build/release-train.json
          targets: ${{ inputs.targets }}
          include-downstream: ${{ inputs.includeDownstream }}
          exclude: ${{ inputs.exclude }}
          bump: ${{ inputs.bump }}
          channel: ${{ inputs.channel }}
          on-failure: ${{ inputs.onFailure }}
          dry-run: ${{ inputs.dryRun }}

  # One job per level. A level starts after the level before it succeeds, or also after it fails when onFailure is continue.
  level-0:
    name: Level 0
    needs: plan
    if: ${{ !inputs.dryRun }}
    uses: ./.github/workflows/release-train-level.yml
    with:
      level: 0
      repositories: ${{ needs.plan.outputs.level0 }}
      settings: ${{ needs.plan.outputs.settings }}
    secrets:
      RELEASE_TRAIN_APP_CLIENT_ID: ${{ secrets.RELEASE_TRAIN_APP_CLIENT_ID }}
      RELEASE_TRAIN_APP_PRIVATE_KEY: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}

  level-1:
    name: Level 1
    needs: [plan, level-0]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.depth) > 1 && (needs.level-0.result == 'success' || (inputs.onFailure == 'continue' && needs.level-0.result == 'failure')) }}
    uses: ./.github/workflows/release-train-level.yml
    with:
      level: 1
      repositories: ${{ needs.plan.outputs.level1 }}
      settings: ${{ needs.plan.outputs.settings }}
    secrets:
      RELEASE_TRAIN_APP_CLIENT_ID: ${{ secrets.RELEASE_TRAIN_APP_CLIENT_ID }}
      RELEASE_TRAIN_APP_PRIVATE_KEY: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}

  level-2:
    name: Level 2
    needs: [plan, level-1]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.depth) > 2 && (needs.level-1.result == 'success' || (inputs.onFailure == 'continue' && needs.level-1.result == 'failure')) }}
    uses: ./.github/workflows/release-train-level.yml
    with:
      level: 2
      repositories: ${{ needs.plan.outputs.level2 }}
      settings: ${{ needs.plan.outputs.settings }}
    secrets:
      RELEASE_TRAIN_APP_CLIENT_ID: ${{ secrets.RELEASE_TRAIN_APP_CLIENT_ID }}
      RELEASE_TRAIN_APP_PRIVATE_KEY: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}

  level-3:
    name: Level 3
    needs: [plan, level-2]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.depth) > 3 && (needs.level-2.result == 'success' || (inputs.onFailure == 'continue' && needs.level-2.result == 'failure')) }}
    uses: ./.github/workflows/release-train-level.yml
    with:
      level: 3
      repositories: ${{ needs.plan.outputs.level3 }}
      settings: ${{ needs.plan.outputs.settings }}
    secrets:
      RELEASE_TRAIN_APP_CLIENT_ID: ${{ secrets.RELEASE_TRAIN_APP_CLIENT_ID }}
      RELEASE_TRAIN_APP_PRIVATE_KEY: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}

  level-4:
    name: Level 4
    needs: [plan, level-3]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.depth) > 4 && (needs.level-3.result == 'success' || (inputs.onFailure == 'continue' && needs.level-3.result == 'failure')) }}
    uses: ./.github/workflows/release-train-level.yml
    with:
      level: 4
      repositories: ${{ needs.plan.outputs.level4 }}
      settings: ${{ needs.plan.outputs.settings }}
    secrets:
      RELEASE_TRAIN_APP_CLIENT_ID: ${{ secrets.RELEASE_TRAIN_APP_CLIENT_ID }}
      RELEASE_TRAIN_APP_PRIVATE_KEY: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}

  level-5:
    name: Level 5
    needs: [plan, level-4]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.depth) > 5 && (needs.level-4.result == 'success' || (inputs.onFailure == 'continue' && needs.level-4.result == 'failure')) }}
    uses: ./.github/workflows/release-train-level.yml
    with:
      level: 5
      repositories: ${{ needs.plan.outputs.level5 }}
      settings: ${{ needs.plan.outputs.settings }}
    secrets:
      RELEASE_TRAIN_APP_CLIENT_ID: ${{ secrets.RELEASE_TRAIN_APP_CLIENT_ID }}
      RELEASE_TRAIN_APP_PRIVATE_KEY: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}

  level-6:
    name: Level 6
    needs: [plan, level-5]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.depth) > 6 && (needs.level-5.result == 'success' || (inputs.onFailure == 'continue' && needs.level-5.result == 'failure')) }}
    uses: ./.github/workflows/release-train-level.yml
    with:
      level: 6
      repositories: ${{ needs.plan.outputs.level6 }}
      settings: ${{ needs.plan.outputs.settings }}
    secrets:
      RELEASE_TRAIN_APP_CLIENT_ID: ${{ secrets.RELEASE_TRAIN_APP_CLIENT_ID }}
      RELEASE_TRAIN_APP_PRIVATE_KEY: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}

  level-7:
    name: Level 7
    needs: [plan, level-6]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.depth) > 7 && (needs.level-6.result == 'success' || (inputs.onFailure == 'continue' && needs.level-6.result == 'failure')) }}
    uses: ./.github/workflows/release-train-level.yml
    with:
      level: 7
      repositories: ${{ needs.plan.outputs.level7 }}
      settings: ${{ needs.plan.outputs.settings }}
    secrets:
      RELEASE_TRAIN_APP_CLIENT_ID: ${{ secrets.RELEASE_TRAIN_APP_CLIENT_ID }}
      RELEASE_TRAIN_APP_PRIVATE_KEY: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}

  level-8:
    name: Level 8
    needs: [plan, level-7]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.depth) > 8 && (needs.level-7.result == 'success' || (inputs.onFailure == 'continue' && needs.level-7.result == 'failure')) }}
    uses: ./.github/workflows/release-train-level.yml
    with:
      level: 8
      repositories: ${{ needs.plan.outputs.level8 }}
      settings: ${{ needs.plan.outputs.settings }}
    secrets:
      RELEASE_TRAIN_APP_CLIENT_ID: ${{ secrets.RELEASE_TRAIN_APP_CLIENT_ID }}
      RELEASE_TRAIN_APP_PRIVATE_KEY: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}

  level-9:
    name: Level 9
    needs: [plan, level-8]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.depth) > 9 && (needs.level-8.result == 'success' || (inputs.onFailure == 'continue' && needs.level-8.result == 'failure')) }}
    uses: ./.github/workflows/release-train-level.yml
    with:
      level: 9
      repositories: ${{ needs.plan.outputs.level9 }}
      settings: ${{ needs.plan.outputs.settings }}
    secrets:
      RELEASE_TRAIN_APP_CLIENT_ID: ${{ secrets.RELEASE_TRAIN_APP_CLIENT_ID }}
      RELEASE_TRAIN_APP_PRIVATE_KEY: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}

  summary:
    name: Summary
    needs: [plan, level-0, level-1, level-2, level-3, level-4, level-5, level-6, level-7, level-8, level-9]
    if: ${{ always() && needs.plan.result == 'success' && !inputs.dryRun }}
    runs-on: ubuntu-latest
    outputs:
      results: ${{ steps.summary.outputs.results }}
    steps:
      - name: Setup .NET Environment
        uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
        with:
          stamp-version: 'false'

      # A train cancelled before its first result has nothing to download. The summary then lists every repository as not started.
      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: train-result-*
          merge-multiple: true
          path: ${{ runner.temp }}/train-results

      - name: Summarise the train
        id: summary
        uses: reactiveui/actions-common/.github/actions/release-train-summary@main
        with:
          plan: ${{ needs.plan.outputs.plan }}
          results-folder: ${{ runner.temp }}/train-results
