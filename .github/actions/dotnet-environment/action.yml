name: .NET Environment Setup
description: Set up the .NET SDK, optional workloads and MinVer version stamping from the latest reachable tag.

inputs:
  dotnet-versions:
    description: 'Newline-separated list of .NET SDK versions. A job that builds or tests a project passes every SDK it targets.'
    required: false
    default: '11.0.x'
  src-folder:
    description: 'Folder containing the solution'
    required: false
    default: 'src'
  solution-file:
    description: 'Solution file relative to src-folder'
    required: false
    default: ''
  install-workloads:
    description: 'Run dotnet workload restore'
    required: false
    default: 'false'
  stamp-version:
    description: 'Stamp the version with MinVer. Set false for a job with no checkout, or one that stamps the version itself later.'
    required: false
    default: 'true'
  minver-tag-prefix:
    description: 'Tag prefix for MinVer (default v).'
    required: false
    default: 'v'
  minver-minimum-major-minor:
    description: 'MinVer floor major.minor when no tag is reachable (e.g. "1.0"). Empty leaves MinVer at 0.0.'
    required: false
    default: ''
  minver-default-pre-release-identifiers:
    description: 'MinVer pre-release identifiers for height-only builds.'
    required: false
    default: 'alpha.0'
  minver-auto-increment:
    description: 'MinVer auto-increment segment (major|minor|patch).'
    required: false
    default: 'minor'
  minver-version-override:
    description: 'Exact version to stamp, bypassing the MinVer git walk (e.g. "11.4.13" for an out-of-sequence / backport release). Empty = compute from tags as normal.'
    required: false
    default: ''

outputs:
  nbgv-semver2:
    description: 'MinVer SemVer2 version string. Name kept for backward compatibility with callers that consumed the old nbgv output.'
    value: ${{ steps.minver.outputs.SemVer2 }}
  version-semver2:
    description: 'Alias for nbgv-semver2 with a tool-neutral name.'
    value: ${{ steps.minver.outputs.SemVer2 }}

runs:
  using: composite
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        # The action scripts here and in the minver action run on .NET 11, whatever the caller builds with.
        dotnet-version: |
          ${{ inputs.dotnet-versions }}
          11.0.x

    - name: Configure .NET CLI environment
      shell: bash
      run: |
        echo "DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1" >> "$GITHUB_ENV"
        echo "DOTNET_NOLOGO=1" >> "$GITHUB_ENV"
        echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"

    - name: Configure Windows Defender exclusions
      if: runner.os == 'Windows'
      shell: pwsh
      # Real-time scanning of build output is a large share of Windows build time. Best-effort: -ErrorAction Continue
      # reports a failure and carries on, and the step's exit code ignores it.
      run: |
        Add-MpPreference -ErrorAction Continue -ExclusionPath $env:GITHUB_WORKSPACE, $env:DOTNET_ROOT, $env:RUNNER_TEMP, (Join-Path $env:USERPROFILE '.nuget')
        Add-MpPreference -ErrorAction Continue -ExclusionProcess dotnet.exe, MSBuild.exe, VBCSCompiler.exe

    - name: Restore .NET Workloads
      if: inputs.install-workloads == 'true'
      shell: bash
      env:
        SRC_FOLDER: ${{ inputs.src-folder }}
        SOLUTION_FILE: ${{ inputs.solution-file }}
      working-directory: ${{ runner.temp }}
      run: dotnet run --file "$GITHUB_ACTION_PATH/dotnet-environment.cs" -- "$SRC_FOLDER" "$SOLUTION_FILE"

    - name: Stamp version with MinVer
      id: minver
      if: inputs.stamp-version == 'true'
      uses: reactiveui/actions-common/.github/actions/minver@main
      with:
        tag-prefix: ${{ inputs.minver-tag-prefix }}
        minimum-major-minor: ${{ inputs.minver-minimum-major-minor }}
        default-pre-release-identifiers: ${{ inputs.minver-default-pre-release-identifiers }}
        auto-increment: ${{ inputs.minver-auto-increment }}
        version-override: ${{ inputs.minver-version-override }}
