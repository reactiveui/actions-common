name: .NET Environment Setup
description: |
  Setup .NET SDK with caching, optional workloads, and version stamping with
  MinVer. Version is computed from the latest reachable v-prefixed tag (or the
  minver-minimum-major-minor floor when none is reachable).

inputs:
  dotnet-versions:
    description: 'Newline-separated list of .NET SDK versions'
    required: true
  src-folder:
    description: 'Folder containing the solution'
    required: false
    default: 'src'
  solution-file:
    description: 'Solution file relative to src-folder'
    required: false
    default: ''
  install-workloads:
    description: 'Run dotnet workload restore'
    required: false
    default: 'false'
  minver-tag-prefix:
    description: 'Tag prefix for MinVer (default v).'
    required: false
    default: 'v'
  minver-minimum-major-minor:
    description: 'MinVer floor major.minor when no tag is reachable (e.g. "1.0"). Empty leaves MinVer at 0.0.'
    required: false
    default: ''
  minver-default-pre-release-identifiers:
    description: 'MinVer pre-release identifiers for height-only builds.'
    required: false
    default: 'alpha.0'
  minver-auto-increment:
    description: 'MinVer auto-increment segment (major|minor|patch).'
    required: false
    default: 'minor'
  minver-version-override:
    description: 'Exact version to stamp, bypassing the MinVer git walk (e.g. "11.4.13" for an out-of-sequence / backport release). Empty = compute from tags as normal.'
    required: false
    default: ''

outputs:
  nbgv-semver2:
    description: 'MinVer SemVer2 version string. Name kept for backward compatibility with callers that consumed the old nbgv output.'
    value: ${{ steps.minver.outputs.SemVer2 }}
  version-semver2:
    description: 'Alias for nbgv-semver2 with a tool-neutral name.'
    value: ${{ steps.minver.outputs.SemVer2 }}

runs:
  using: composite
  steps:
    - name: Configure .NET CLI environment
      shell: bash
      # Quiet/telemetry hygiene only. We deliberately do NOT relocate the SDK or
      # cache workloads: GitHub caches are branch-scoped, so a multi-GB workload
      # cache is duplicated per branch/PR and blows the 10 GB OSS free budget,
      # evicting even the NuGet cache that does help. Workloads install fresh.
      run: |
        {
          echo "DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1"
          echo "DOTNET_NOLOGO=1"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
        } >> "$GITHUB_ENV"

    - name: Setup .NET SDK with NuGet package cache
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-versions }}
        cache: true
        cache-dependency-path: |
          **/Directory.Packages.props
          **/*.csproj
          **/global.json
          **/nuget.config

    - name: Configure Windows Defender exclusions
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Real-time scanning of every compiled assembly and obj file is a large
        # share of the Windows build/test penalty. Exclude the build trees and
        # the dotnet/NuGet caches for this runner session (best-effort).
        $paths = @($env:GITHUB_WORKSPACE, $env:DOTNET_ROOT, $env:RUNNER_TEMP, (Join-Path $env:USERPROFILE '.nuget')) | Where-Object { $_ }
        foreach ($p in $paths) {
          try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop; Write-Host "Defender exclusion: $p" }
          catch { Write-Host "Skipped Defender exclusion for $p ($($_.Exception.Message))" }
        }
        foreach ($proc in 'dotnet.exe', 'MSBuild.exe', 'VBCSCompiler.exe') {
          try { Add-MpPreference -ExclusionProcess $proc -ErrorAction Stop } catch { }
        }

    - name: Resolve NuGet HTTP v3 cache path (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      # actions/cache does not expand %LOCALAPPDATA%, so the previous literal
      # path never matched and the Windows feed cache silently never restored.
      run: echo "NUGET_V3_CACHE_PATH=$env:LOCALAPPDATA\NuGet\v3-cache" >> $env:GITHUB_ENV

    - name: Cache NuGet HTTP v3 feed responses (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_V3_CACHE_PATH }}
        key: ${{ runner.os }}-nugetv3-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/global.json', '**/nuget.config') }}
        restore-keys: |
          ${{ runner.os }}-nugetv3-

    - name: Cache NuGet HTTP v3 feed responses (Unix)
      if: runner.os != 'Windows'
      uses: actions/cache@v6
      with:
        path: ~/.local/share/NuGet/v3-cache
        key: ${{ runner.os }}-nugetv3-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/global.json', '**/nuget.config') }}
        restore-keys: |
          ${{ runner.os }}-nugetv3-

    - name: Restore .NET Workloads
      if: inputs.install-workloads == 'true'
      shell: bash
      working-directory: ${{ inputs.src-folder }}
      run: |
        # Determine the solution/project file to pass to workload restore.
        # If explicitly provided use that, otherwise auto-detect .slnx/.sln in the working directory.
        TARGET="${{ inputs.solution-file }}"
        if [ -z "$TARGET" ]; then
          TARGET=$(find . -maxdepth 1 \( -name '*.slnx' -o -name '*.sln' \) -print -quit)
        fi
        if [ -n "$TARGET" ]; then
          dotnet workload restore "$TARGET" --from-previous-sdk --skip-manifest-update
        else
          dotnet workload restore --from-previous-sdk --skip-manifest-update
        fi

    - name: Stamp version with MinVer
      id: minver
      uses: reactiveui/actions-common/.github/actions/minver@main
      with:
        tag-prefix: ${{ inputs.minver-tag-prefix }}
        minimum-major-minor: ${{ inputs.minver-minimum-major-minor }}
        default-pre-release-identifiers: ${{ inputs.minver-default-pre-release-identifiers }}
        auto-increment: ${{ inputs.minver-auto-increment }}
        version-override: ${{ inputs.minver-version-override }}
