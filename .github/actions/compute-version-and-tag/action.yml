name: Compute version and tag
description: |
  Cut a clean version for a tag-first MinVer repo. Given a bump level
  (major|minor|patch), find the latest RTM tag (<prefix>X.Y.Z, ignoring
  pre-release tags), increment the requested segment, create and push the new
  tag on HEAD, and export MINVERVERSIONOVERRIDE so the subsequent build/pack
  stamps that exact version.

  Pre-release channel (pre-release-id, e.g. beta): the bumped core is suffixed
  with -<id>.<N>, where <N> auto-increments from the highest existing
  <prefix><core>-<id>.<N> tag (starting at 1). So bump=major + pre-release-id=beta
  off v5.4.0 yields v6.0.0-beta.1, then v6.0.0-beta.2 on the next run, and a later
  bump=major with no pre-release-id finalises the same core as v6.0.0. Dotted
  SemVer 2.0 form (-beta.1, not -beta-1) so NuGet orders pre-releases correctly.

  Brand-new repo with no RTM tag yet: the baseline is seeded at 0.0.0, so the
  first release comes straight from the bump (patch -> 0.0.1, minor -> 0.1.0,
  major -> 1.0.0) with no manual first tag required.

  With an empty bump this action is a no-op: it emits empty outputs and changes
  nothing, so the normal CI path (MinVer at HEAD producing a pre-release) is
  unaffected.

  Requires the job to have `contents: write` so the tag can be pushed, and the
  checkout to include full history + tags (e.g. fetch-depth: 0).

inputs:
  bump:
    description: 'Release level: major | minor | patch. Empty = no-op (CI build).'
    required: false
    default: ''
  tag-prefix:
    description: 'Tag prefix for RTM tags (default v).'
    required: false
    default: 'v'
  push-tag:
    description: 'true = create and push the tag now. false = only compute the version + export MINVERVERSIONOVERRIDE and emit the tag name, leaving tag creation to a later step (e.g. GitHub release creation), so a failed build/sign/publish does not leave an orphan tag.'
    required: false
    default: 'true'
  pre-release-id:
    description: 'Pre-release channel identifier (e.g. alpha, beta, rc). Empty = stable RTM release. When set, the computed version is <core>-<id>.<N> where <core> is the bumped stable version and <N> auto-increments from the highest existing <prefix><core>-<id>.<N> tag (starting at 1). Must be a SemVer 2.0 alphanumeric/hyphen identifier (no dots).'
    required: false
    default: ''

outputs:
  version:
    description: 'Computed version (e.g. 2.4.0, or 6.0.0-beta.1 for a pre-release). Empty when bump is empty.'
    value: ${{ steps.compute.outputs.version }}
  tag:
    description: 'Pushed tag, prefix included (e.g. v2.4.0 or v6.0.0-beta.1). Empty when bump is empty.'
    value: ${{ steps.compute.outputs.tag }}
  prerelease:
    description: 'true when a pre-release version was computed (pre-release-id set), false for a stable RTM version. Empty when bump is empty.'
    value: ${{ steps.compute.outputs.prerelease }}

runs:
  using: composite
  steps:
    - name: Compute next RTM version and push tag
      id: compute
      shell: bash
      env:
        BUMP: ${{ inputs.bump }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        PUSH_TAG: ${{ inputs.push-tag }}
        PRE_RELEASE_ID: ${{ inputs.pre-release-id }}
      run: |
        set -euo pipefail

        if [ -z "$BUMP" ]; then
          echo "No bump requested; skipping version/tag computation (CI pre-release path)."
          exit 0
        fi

        case "$BUMP" in
          major|minor|patch) ;;
          *)
            echo "::error::bump must be one of major|minor|patch (got '$BUMP')."
            exit 1 ;;
        esac

        # Latest RTM tag: <prefix>X.Y.Z, excluding any pre-release tag (those
        # contain a hyphen) and any bare/unprefixed tags. sort -V orders by
        # version so tail -1 is the highest.
        # `|| true` so an empty tag list (brand-new repo) doesn't trip
        # pipefail/set -e: grep exits 1 on no matches, which would otherwise
        # abort before the first-release seeding below.
        LAST="$(git tag --list "${TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" \
                | grep -Ev -- '-' \
                | sort -V \
                | tail -1 \
                | sed "s/^${TAG_PREFIX}//" || true)"

        if [ -z "$LAST" ]; then
          # Brand-new project: no RTM tag in history yet. Seed the baseline at
          # 0.0.0 so the requested bump produces the first release straight from
          # the normal bump math (patch -> 0.0.1, minor -> 0.1.0, major -> 1.0.0)
          # instead of forcing a manual first tag.
          echo "No RTM tag (${TAG_PREFIX}X.Y.Z) found in history; seeding first release from 0.0.0."
          LAST="0.0.0"
        fi

        IFS=. read -r MAJ MIN PAT <<< "$LAST"

        case "$BUMP" in
          major) CORE="$((MAJ + 1)).0.0" ;;
          minor) CORE="${MAJ}.$((MIN + 1)).0" ;;
          patch) CORE="${MAJ}.${MIN}.$((PAT + 1))" ;;
        esac

        if [ -n "$PRE_RELEASE_ID" ]; then
          # SemVer 2.0 pre-release identifiers are alphanumerics and hyphens only.
          # We forbid a dot in the id so "<core>-<id>.<N>" has exactly one dotted
          # numeric counter to parse (e.g. beta.7, not beta.1.7).
          case "$PRE_RELEASE_ID" in
            *[!A-Za-z0-9-]*|'')
              echo "::error::pre-release-id '${PRE_RELEASE_ID}' must be a SemVer 2.0 alphanumeric/hyphen identifier (no dots)."
              exit 1 ;;
          esac

          # Auto-increment the channel counter: scan existing
          # <prefix><core>-<id>.<N> tags and take max(N)+1, starting at 1 when
          # this is the first pre-release of this core+channel. The counter is
          # per (core, channel), so switching beta -> rc restarts at rc.1.
          MAXN=0
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            n="${t##*.}"               # trailing segment after the last dot
            case "$n" in
              ''|*[!0-9]*) continue ;; # ignore tags without a numeric counter
            esac
            if [ "$n" -gt "$MAXN" ]; then MAXN="$n"; fi
          done < <(git tag --list "${TAG_PREFIX}${CORE}-${PRE_RELEASE_ID}.[0-9]*")

          NEXT=$((MAXN + 1))
          VERSION="${CORE}-${PRE_RELEASE_ID}.${NEXT}"
          PRERELEASE=true
        else
          VERSION="${CORE}"
          PRERELEASE=false
        fi

        TAG="${TAG_PREFIX}${VERSION}"
        echo "Latest RTM tag: ${TAG_PREFIX}${LAST} -> next (${BUMP}${PRE_RELEASE_ID:+, ${PRE_RELEASE_ID}}): ${TAG}"

        if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
          echo "::error::Tag ${TAG} already exists. Refusing to re-release an existing version."
          exit 1
        fi

        if [ "${PUSH_TAG}" = "true" ]; then
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$TAG"
          git push origin "$TAG"
          echo "Pushed tag ${TAG}."
        else
          echo "push-tag=false: computed ${TAG} but not creating it now (deferred, e.g. to GitHub release creation)."
        fi

        # Stamp every downstream MSBuild project with this exact version and skip
        # MinVer's per-project git walk.
        echo "MINVERVERSIONOVERRIDE=${VERSION}" >> "$GITHUB_ENV"

        {
          echo "version=${VERSION}"
          echo "tag=${TAG}"
          echo "prerelease=${PRERELEASE}"
        } >> "$GITHUB_OUTPUT"
