name: Detect Changes
description: Report whether a push or pull request changes files under .github, outside it, or both; other events report both.

outputs:
  code:
    description: "'true' when a file outside .github changed."
    value: ${{ steps.detect.outputs.code }}
  workflows:
    description: "'true' when a file under .github changed."
    value: ${{ steps.detect.outputs.workflows }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 2

    - name: Setup .NET Environment
      uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
      with:
        stamp-version: 'false'

    - name: Compare changed files
      id: detect
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
      working-directory: ${{ runner.temp }}
      run: dotnet run --file "$GITHUB_ACTION_PATH/detect-changes.cs" -- "$EVENT_NAME" "$BEFORE"
