name: .NET Test
description: Run tests on Microsoft Testing Platform (MTP) with native coverage and per-OS artifact upload

inputs:
  configuration:
    description: 'Build configuration'
    required: false
    default: 'Release'
  src-folder:
    description: 'Folder containing the solution'
    required: false
    default: 'src'
  solution-file:
    description: 'Solution file relative to src-folder'
    required: false
    default: ''
  enable-detailed-test-logging:
    description: 'Enable MTP diagnostic logging for hang/crash debugging: writes log_*.diag (Trace level, synchronous), turns on framework log-level Trace, and switches console output to Detailed (real-time per-test).'
    required: false
    default: 'true'
  test-timeout:
    description: 'Optional global test timeout passed to MTP --timeout (format [h|m|s], e.g. "5m"). Empty = no timeout. Use to fail fast on hangs instead of letting the CI runner kill the job.'
    required: false
    default: ''
  test-projects:
    description: 'Optional newline-separated globs, relative to the solution folder, choosing which of the solution''s projects to test (e.g. "tests/**/*.csproj"). A line starting with "!" excludes matches. Empty = every test project in the solution.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Expose GitHub Actions runtime for TUnit HTML report upload
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        script: |
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
          core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

    - name: Run tests with Microsoft Testing Platform and native coverage
      shell: bash
      env:
        SRC_FOLDER: ${{ inputs.src-folder }}
        SOLUTION_FILE: ${{ inputs.solution-file }}
        CONFIGURATION: ${{ inputs.configuration }}
        DETAILED_LOGGING: ${{ inputs.enable-detailed-test-logging }}
        TEST_TIMEOUT: ${{ inputs.test-timeout }}
        TEST_PROJECTS: ${{ inputs.test-projects }}
      run: |
        cd "$RUNNER_TEMP" && dotnet run - -- "$SRC_FOLDER" "$SOLUTION_FILE" "$CONFIGURATION" "$DETAILED_LOGGING" "$TEST_TIMEOUT" "$TEST_PROJECTS" <<'CS'
        #:package Microsoft.Extensions.FileSystemGlobbing@10.0.12

        using System.Diagnostics;
        using System.Text.Json;
        using System.Text.RegularExpressions;
        using System.Xml.Linq;
        using Microsoft.Extensions.FileSystemGlobbing;
        using static System.Environment;

        if (args is not [var srcFolder, var solutionFile, var configuration, var detailedLogging, var testTimeout, var testProjects])
        {
            Console.WriteLine("::error::Expected the source folder, solution file, configuration, detailed logging, test timeout and test projects arguments.");
            return 2;
        }

        Directory.SetCurrentDirectory(Path.Combine(GetEnvironmentVariable("GITHUB_WORKSPACE")!, srcFolder));

        if (!File.Exists("testconfig.json"))
        {
            Console.WriteLine($"::error::MTP requires '{srcFolder}/testconfig.json' (manages coverage and execution). See https://learn.microsoft.com/en-us/dotnet/core/testing/microsoft-testing-platform-extensions-code-coverage");
            return 1;
        }

        string? solutionPath = solutionFile is not ""
            ? solutionFile
            : Directory.EnumerateFiles(".", "*.slnx").Concat(Directory.EnumerateFiles(".", "*.sln")).FirstOrDefault();
        string[] solution = solutionPath is null ? [] : ["--solution", solutionPath];

        string[] patterns = testProjects.Split('\n', StringSplitOptions.RemoveEmptyEntries | StringSplitOptions.TrimEntries);
        if (patterns is not [])
        {
            if (solutionPath is null)
            {
                Console.WriteLine("::error::test-projects needs a solution to choose projects from; set solution-file.");
                return 1;
            }

            // Match the solution's own project list in memory; nothing is read from disk.
            Matcher matcher = new(StringComparison.OrdinalIgnoreCase);
            matcher.AddIncludePatterns(patterns.Where(static p => !p.StartsWith('!')));
            matcher.AddExcludePatterns(patterns.Where(static p => p.StartsWith('!')).Select(static p => p[1..]));

            string root = Path.GetDirectoryName(Path.GetFullPath(solutionPath))!;
            Dictionary<string, string> listed = [with(StringComparer.OrdinalIgnoreCase)];
            foreach (string project in SolutionProjects(solutionPath))
            {
                listed[project.Replace('\\', '/')] = project;
            }

            string[] projects = [.. matcher.Match(root, listed.Keys.Select(path => Path.Combine(root, path))).Files
                .Select(match => listed[match.Path])];

            if (projects is [])
            {
                Console.WriteLine($"::error::No project in {solutionPath} matches test-projects: {string.Join(", ", patterns)}");
                return 1;
            }

            // A solution filter keeps dotnet test running the chosen projects in parallel, as it does for the whole solution.
            string filterPath = Path.Combine(root, "ci-test-projects.slnf");
            using (FileStream stream = File.Create(filterPath))
            using (Utf8JsonWriter writer = new(stream, new JsonWriterOptions { Indented = true }))
            {
                writer.WriteStartObject();
                writer.WriteStartObject("solution");
                writer.WriteString("path", Path.GetFileName(solutionPath));
                writer.WriteStartArray("projects");
                foreach (string project in projects)
                {
                    writer.WriteStringValue(project);
                }

                writer.WriteEndArray();
                writer.WriteEndObject();
                writer.WriteEndObject();
            }

            Console.WriteLine($"Testing {projects.Length} project(s) matching test-projects:");
            foreach (string project in projects)
            {
                Console.WriteLine($"  {project}");
            }

            solution = ["--solution", filterPath];
        }

        // --verbosity is VSTest-only and ignored by MTP. Synchronous writes keep the log when the runner kills a hung test.
        string[] diagnostics = detailedLogging is "true"
            ? ["--diagnostic", "--diagnostic-verbosity", "Trace", "--diagnostic-synchronous-write", "--log-level", "Trace", "--output", "Detailed"]
            : [];

        string[] timeout = testTimeout is "" ? [] : ["--timeout", testTimeout];

        // No --results-directory: parallel test hosts sharing one directory collide on log_<ts>.diag names.
        return Process.Run(
            "dotnet",
            ["test", .. solution, "--no-build", "--configuration", configuration, .. diagnostics, .. timeout, "--coverage", "--coverage-output-format", "cobertura"]).ExitCode;

        // Project paths as the solution lists them, relative to the solution's folder.
        static IEnumerable<string> SolutionProjects(string solutionPath) =>
            solutionPath.EndsWith(".slnx", StringComparison.OrdinalIgnoreCase)
                ? XDocument.Load(solutionPath).Descendants("Project").Select(static p => (string?)p.Attribute("Path")).OfType<string>()
                : Regex.Matches(File.ReadAllText(solutionPath), "^Project\\(\"[^\"]*\"\\)\\s*=\\s*\"[^\"]*\",\\s*\"([^\"]+\\.[a-z]+proj)\"", RegexOptions.Multiline | RegexOptions.IgnoreCase)
                    .Select(static m => m.Groups[1].Value);
        CS

    - name: Upload per-OS coverage reports as build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: tmp-coverage-${{ runner.os }}
        path: |
          ${{ inputs.src-folder }}/**/coverage.cobertura.xml
          ${{ inputs.src-folder }}/**/coverage*.cobertura.xml
          ${{ inputs.src-folder }}/**/TestResults/**/*.cobertura.xml
        if-no-files-found: warn
        retention-days: 3

    - name: Upload MTP diagnostic logs
      if: always() && inputs.enable-detailed-test-logging == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: mtp-diagnostic-logs-${{ runner.os }}
        path: |
          ${{ inputs.src-folder }}/**/TestResults/**/*.diag
          ${{ inputs.src-folder }}/**/TestResults/**/log_*.diag
        if-no-files-found: ignore
        retention-days: 7
