name: .NET Test
description: Run tests on Microsoft Testing Platform (MTP) with native coverage and per-OS artifact upload

inputs:
  configuration:
    description: 'Build configuration'
    required: false
    default: 'Release'
  src-folder:
    description: 'Folder containing the solution'
    required: false
    default: 'src'
  solution-file:
    description: 'Solution file relative to src-folder'
    required: false
    default: ''
  enable-detailed-test-logging:
    description: 'Enable MTP diagnostic logging for hang/crash debugging: writes log_*.diag (Trace level, synchronous), turns on framework log-level Trace, and switches console output to Detailed (real-time per-test).'
    required: false
    default: 'true'
  test-timeout:
    description: 'Optional global test timeout passed to MTP --timeout (format [h|m|s], e.g. "5m"). Empty = no timeout. Use to fail fast on hangs instead of letting the CI runner kill the job.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve solution file for MTP test runner
      id: resolve-solution
      shell: bash
      working-directory: ${{ inputs.src-folder }}
      run: |
        # MTP requires a testconfig.json alongside the solution to manage
        # coverage and execution. Fail with a clear message if it is missing.
        if [ ! -f "testconfig.json" ]; then
          echo "::error::MTP requires '${{ inputs.src-folder }}/testconfig.json' (manages coverage and execution). See https://learn.microsoft.com/en-us/dotnet/core/testing/microsoft-testing-platform-extensions-code-coverage"
          exit 1
        fi

        if [ -n "${{ inputs.solution-file }}" ]; then
          echo "solution-arg=--solution ${{ inputs.solution-file }}" >> $GITHUB_OUTPUT
        else
          SLN_FILE=$(find . -maxdepth 1 \( -name "*.sln" -o -name "*.slnx" \) | head -n 1)
          if [ -n "$SLN_FILE" ]; then
            echo "solution-arg=--solution $SLN_FILE" >> $GITHUB_OUTPUT
          else
            echo "solution-arg=" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Expose GitHub Actions runtime for TUnit HTML report upload
      uses: actions/github-script@v9
      with:
        script: |
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
          core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

    - name: Run tests with Microsoft Testing Platform and native coverage
      shell: bash
      working-directory: ${{ inputs.src-folder }}
      run: |
        DIAG_ARGS=""
        if [ "${{ inputs.enable-detailed-test-logging }}" == "true" ]; then
          # MTP diagnostic logging — note --verbosity is a VSTest flag and is
          # silently ignored by MTP, so we use the real MTP flags here.
          # Sync file writes are critical: async logs are lost if a hanging
          # test gets killed by the CI runner.
          DIAG_ARGS="--diagnostic --diagnostic-verbosity Trace --diagnostic-synchronous-write --log-level Trace --output Detailed"
        fi
        TIMEOUT_ARGS=""
        if [ -n "${{ inputs.test-timeout }}" ]; then
          TIMEOUT_ARGS="--timeout ${{ inputs.test-timeout }}"
        fi

        # No --results-directory: MTP's per-app default keeps each TFM's diag
        # log in its own dir, avoiding a flaky log_<ts>.diag filename collision
        # across parallel test hosts. Globs below still collect coverage/.diag.
        # shellcheck disable=SC2086
        dotnet test ${{ steps.resolve-solution.outputs.solution-arg }} \
          --no-build \
          --configuration ${{ inputs.configuration }} \
          $DIAG_ARGS \
          $TIMEOUT_ARGS \
          --coverage \
          --coverage-output-format cobertura

    - name: Upload per-OS coverage reports as build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: tmp-coverage-${{ runner.os }}
        path: |
          ${{ inputs.src-folder }}/**/coverage.cobertura.xml
          ${{ inputs.src-folder }}/**/coverage*.cobertura.xml
          ${{ inputs.src-folder }}/**/TestResults/**/*.cobertura.xml
        if-no-files-found: warn
        retention-days: 3

    # Always upload MTP diagnostic logs (when produced) so hangs/crashes are
    # debuggable. if: always() ensures the upload runs even if the test step
    # failed or was killed.
    - name: Upload MTP diagnostic logs
      if: always() && inputs.enable-detailed-test-logging == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: mtp-diagnostic-logs-${{ runner.os }}
        path: |
          ${{ inputs.src-folder }}/**/TestResults/**/*.diag
          ${{ inputs.src-folder }}/**/TestResults/**/log_*.diag
        if-no-files-found: ignore
        retention-days: 7
