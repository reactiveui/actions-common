name: .NET Benchmarks
description: Check out a commit and run BenchmarkDotNet projects, writing their reports to a results folder.

inputs:
  revision:
    description: 'Commit to check out. Empty uses the commit that triggered the run.'
    required: false
    default: ''
  projects:
    description: 'Newline-separated benchmark projects (.csproj), relative to src.'
    required: true
  results-folder:
    description: 'Absolute folder the reports are written to, one subfolder per project.'
    required: true
  solution-file:
    description: 'Solution the workload restore reads, relative to src.'
    required: false
    default: ''
  install-workloads:
    description: 'Run workload restore.'
    required: false
    default: 'false'
  dotnet-versions:
    description: 'Newline-separated list of .NET SDKs to install. It must cover every runtime the benchmark classes declare a job for.'
    required: false
    default: '11.0.x'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.revision }}
        fetch-depth: 0

    - name: Setup .NET Environment
      uses: reactiveui/actions-common/.github/actions/dotnet-environment@main
      with:
        dotnet-versions: ${{ inputs.dotnet-versions }}
        solution-file: ${{ inputs.solution-file }}
        install-workloads: ${{ inputs.install-workloads }}

    - name: Run benchmarks
      shell: bash
      env:
        PROJECTS: ${{ inputs.projects }}
        RESULTS_FOLDER: ${{ inputs.results-folder }}
      working-directory: ${{ runner.temp }}
      run: dotnet run --file "$GITHUB_ACTION_PATH/dotnet-benchmarks.cs" -- "$PROJECTS" "$RESULTS_FOLDER"
