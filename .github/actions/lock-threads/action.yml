name: Lock inactive threads
description: Lock closed issues and pull requests after fourteen days without activity.

runs:
  using: composite
  steps:
    - name: Lock inactive threads
      shell: bash
      working-directory: ${{ runner.temp }}
      run: dotnet run --file "$GITHUB_ACTION_PATH/lock-threads.cs" "-p:ActionSharedSources=$GITHUB_ACTION_PATH/../../../scripts/github/*.cs" "-p:ActionLocalSources=$GITHUB_ACTION_PATH/Program.*.cs"
