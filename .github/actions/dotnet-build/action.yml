name: .NET Build
description: Standard dotnet CLI restore, build, and optional pack

inputs:
  configuration:
    description: 'Build configuration'
    required: false
    default: 'Release'
  src-folder:
    description: 'Folder containing the solution'
    required: false
    default: 'src'
  solution-file:
    description: 'Solution file relative to src-folder'
    required: false
    default: ''
  create-packages:
    description: 'Run dotnet pack after build'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # SOLUTION_FILE stays unquoted so an empty value passes no argument.
    - name: Restore NuGet packages
      shell: bash
      env:
        SOLUTION_FILE: ${{ inputs.solution-file }}
      run: dotnet restore $SOLUTION_FILE
      working-directory: ${{ inputs.src-folder }}

    - name: Build solution with dotnet CLI
      shell: bash
      env:
        CONFIGURATION: ${{ inputs.configuration }}
        SOLUTION_FILE: ${{ inputs.solution-file }}
      run: dotnet build --no-restore --configuration "$CONFIGURATION" $SOLUTION_FILE
      working-directory: ${{ inputs.src-folder }}

    - name: Pack NuGet packages
      if: inputs.create-packages == 'true'
      shell: bash
      env:
        CONFIGURATION: ${{ inputs.configuration }}
        SOLUTION_FILE: ${{ inputs.solution-file }}
      run: dotnet pack --no-restore --configuration "$CONFIGURATION" $SOLUTION_FILE --m:1
      working-directory: ${{ inputs.src-folder }}
