name: Certum SimplySign NuGet signing (SafeSign)
description: |
  Author-sign .nupkg files with a Certum "Code Signing in the Cloud" certificate.

  The action installs the SafeSign .NET tool, which signs through the SimplySign cloud
  service directly, then verifies each package with `dotnet nuget verify`. It needs the
  .NET SDK, so run dotnet-environment first. It runs on any GitHub runner.

  Credentials are read from the environment, because composite actions cannot declare
  secret-typed inputs. Map these secrets into env on the calling job:
    CERTUM_USER_ID            SimplySign login id
    CERTUM_OTP_URI            otpauth:// URI for the SimplySign TOTP
    CERTUM_CERT_FINGERPRINT   (optional) SHA-256 fingerprint to assert against

inputs:
  packages-glob:
    description: 'Glob of .nupkg files to sign (relative to the working directory).'
    required: false
    default: 'signed/*.nupkg'
  timestamp-url:
    description: 'RFC3161 timestamp authority URL.'
    required: false
    default: 'http://time.certum.pl'
  safesign-version:
    description: 'Version of the SafeSign .NET tool to install.'
    required: false
    # renovate: datasource=nuget depName=SafeSign
    default: '1.0.0'

runs:
  using: composite
  steps:
    - name: Install SafeSign
      shell: bash
      env:
        SAFESIGN_VERSION: ${{ inputs.safesign-version }}
      run: |
        dotnet tool install --global SafeSign --version "$SAFESIGN_VERSION"
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Sign packages with SafeSign + verify
      shell: bash
      env:
        TS_URL: ${{ inputs.timestamp-url }}
        PKG_GLOB: ${{ inputs.packages-glob }}
      working-directory: ${{ runner.temp }}
      run: dotnet run --file "$GITHUB_ACTION_PATH/certum-sign.cs" -- "$TS_URL" "$PKG_GLOB"
